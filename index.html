
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b18" />
  <title>Sano Live Network Diagnostic</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070913;
      --bg-soft: #0d1021;
      --panel: rgba(16, 19, 38, 0.78);
      --panel-strong: rgba(18, 21, 44, 0.94);
      --border: rgba(162, 140, 255, 0.18);
      --text: #f7f8ff;
      --muted: #9aa3bd;
      --purple: #a56cff;
      --purple-2: #7c4dff;
      --cyan: #55d9ff;
      --green: #54e39a;
      --yellow: #ffc85a;
      --red: #ff6b83;
      --neutral: #aab2c8;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 38px 38px;
      -webkit-mask-image: linear-gradient(to bottom, black 0%, rgba(0,0,0,.45) 54%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 0%, rgba(0,0,0,.45) 54%, transparent 100%);
    }

    .orb {
      position: fixed;
      border-radius: 999px;
      filter: blur(70px);
      pointer-events: none;
      opacity: .38;
      animation: floatOrb 10s ease-in-out infinite alternate;
    }

    .orb.one {
      width: 320px;
      height: 320px;
      top: -110px;
      left: -90px;
      background: #723cff;
    }

    .orb.two {
      width: 280px;
      height: 280px;
      right: -100px;
      top: 28%;
      background: #006eff;
      animation-delay: -3s;
    }

    .orb.three {
      width: 240px;
      height: 240px;
      left: 35%;
      bottom: -130px;
      background: #d84cff;
      animation-delay: -6s;
    }

    @keyframes floatOrb {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(18px, 24px, 0) scale(1.08); }
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    }

    .shell {
      width: min(100%, 520px);
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
      filter: drop-shadow(0 12px 28px rgba(127, 76, 255, .25));
    }

    .logo {
      width: min(74vw, 290px);
      height: auto;
      display: block;
    }

    .card {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(26, 29, 57, .88), rgba(12, 15, 31, .92));
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.035);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 0%, rgba(168, 103, 255, .14), transparent 34%),
        radial-gradient(circle at 100% 75%, rgba(69, 201, 255, .08), transparent 35%);
    }

    .main {
      position: relative;
      padding: 26px;
    }

    .intro {
      text-align: center;
      margin-bottom: 24px;
    }

    .intro h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: .02em;
      font-weight: 700;
    }

    .intro p {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .field-label {
      display: block;
      margin: 0 0 9px 4px;
      font-size: 13px;
      color: #c8cee2;
      font-weight: 600;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 17px;
      background: linear-gradient(115deg, rgba(160, 105, 255, .55), rgba(75, 208, 255, .16), rgba(255,255,255,.08));
      opacity: .46;
      pointer-events: none;
    }

    input {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 58px;
      border: 0;
      outline: 0;
      border-radius: 16px;
      padding: 0 18px;
      background: rgba(6, 8, 20, .88);
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .06em;
      caret-color: var(--cyan);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
      transition: box-shadow .2s ease, transform .2s ease;
    }

    input:focus {
      box-shadow:
        inset 0 0 0 1px rgba(123, 96, 255, .38),
        0 0 0 4px rgba(117, 78, 255, .11);
    }

    input::placeholder {
      color: #626b86;
      font-size: 15px;
      letter-spacing: 0;
      font-weight: 500;
    }


    .start-btn {
      position: relative;
      width: 100%;
      height: 58px;
      margin-top: 12px;
      border: 0;
      border-radius: 17px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      overflow: hidden;
      background:
        linear-gradient(105deg, #6942ed 0%, #9c56ff 48%, #477dff 100%);
      box-shadow:
        0 14px 32px rgba(104, 65, 235, .28),
        inset 0 1px 0 rgba(255,255,255,.24);
      transition: transform .2s ease, filter .2s ease, opacity .2s ease;
    }

    .start-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-120%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.26), transparent);
      transition: transform .55s ease;
    }

    .start-btn:hover::before {
      transform: translateX(120%);
    }

    .start-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.07);
    }

    .start-btn:active {
      transform: translateY(1px) scale(.995);
    }

    .start-btn:disabled {
      cursor: not-allowed;
      opacity: .64;
      transform: none;
      filter: none;
    }

    .diagnostic {
      display: none;
      margin-top: 24px;
      animation: reveal .36s ease both;
    }

    .diagnostic.show {
      display: block;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(167, 150, 255, .2), transparent);
      margin-bottom: 22px;
    }

    .progress-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .progress-head > * + * {
      margin-left: 12px;
    }

    .progress-title {
      font-size: 14px;
      color: #e7eaff;
      font-weight: 700;
    }

    .progress-value {
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      color: #9ca6c2;
    }

    .progress-track {
      height: 10px;
      padding: 2px;
      border-radius: 999px;
      background: rgba(255,255,255,.055);
      box-shadow: inset 0 1px 4px rgba(0,0,0,.32);
      overflow: hidden;
    }

    .progress-bar {
      position: relative;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #7649ff, #b35cff 48%, #51d6ff);
      box-shadow: 0 0 18px rgba(139, 84, 255, .42);
      transition: width .42s cubic-bezier(.22,.8,.28,1);
    }

    .progress-bar::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.65) 50%, transparent 100%);
      transform: translateX(-120%);
      animation: shimmer 1.25s infinite;
    }

    @keyframes shimmer {
      to { transform: translateX(120%); }
    }

    .steps {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    .step {
      display: flex;
      align-items: center;
      min-height: 44px;
      padding: 0 12px;
      border-radius: 13px;
      background: rgba(255,255,255,.025);
      border: 1px solid rgba(255,255,255,.035);
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .step.running {
      background: rgba(124, 77, 255, .08);
      border-color: rgba(150, 110, 255, .18);
      transform: translateX(2px);
    }

    .step-icon {
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-size: 15px;
      font-weight: 800;
      overflow: hidden;
    }

    .step-icon.pending {
      color: #66708d;
    }

    .step-icon.running {
      color: var(--cyan);
      font-size: 0;
      animation: none;
    }

    .step-icon.running::before {
      content: "";
      width: 14px;
      height: 14px;
      border: 2px solid rgba(85, 217, 255, .22);
      border-top-color: currentColor;
      border-radius: 50%;
      display: block;
      margin: 0;
      animation: spin 0.8s linear infinite;
      transform-origin: 50% 50%;
    }

    .step-icon.success {
      color: var(--green);
    }

    .step-icon.warning {
      color: var(--yellow);
    }

    .step-icon.error {
      color: var(--red);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .step-name {
      flex: 1;
      font-size: 14px;
      color: #dfe3f6;
    }

    .step-detail {
      margin-left: 12px;
      font-size: 11px;
      color: #737d99;
      white-space: nowrap;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.018));
      border: 1px solid rgba(255,255,255,.055);
      animation: reveal .34s ease both;
    }

    .result.show {
      display: block;
    }

    .result-state {
      display: flex;
      align-items: center;
      font-size: 18px;
      font-weight: 700;
    }

    .result-state > * + * {
      margin-left: 10px;
    }

    .result-state.normal {
      color: var(--green);
    }

    .result-state.warning {
      color: var(--yellow);
    }

    .result-state.error {
      color: var(--red);
    }

    .result-desc {
      margin-top: 8px;
      color: #939db9;
      font-size: 12px;
      line-height: 1.65;
    }

    .report-box {
      margin-top: 16px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,.06);
    }

    .report-label {
      font-size: 11px;
      color: #747e9b;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .report-id {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 700;
      color: #edf0ff;
      letter-spacing: .06em;
      word-break: break-all;
    }

    .submit-status {
      margin-top: 9px;
      display: flex;
      align-items: center;
      font-size: 12px;
      color: #aab3cb;
    }

    .submit-status > * + * {
      margin-left: 8px;
    }

    .submit-status.ok {
      color: var(--green);
    }

    .submit-status.warn {
      color: var(--yellow);
    }

    .submit-status.error {
      color: var(--red);
    }

    .cooldown {
      margin-top: 12px;
      text-align: center;
      color: #6f7894;
      font-size: 11px;
      min-height: 16px;
    }

    @media (max-width: 480px) {
      .page {
        align-items: flex-start;
        padding-left: 14px;
        padding-right: 14px;
      }

      .shell {
        margin-top: 20px;
      }

      .main {
        padding: 22px 18px;
      }

      .card {
        border-radius: 24px;
      }

      .logo-wrap {
        margin-bottom: 18px;
      }

      .intro h1 {
        font-size: 20px;
      }

      .step {
        padding: 0 10px;
      }

      .step-detail {
        max-width: 128px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>

      <section class="card">

  <script>
    'use strict';

    const WORKER_URL = 'https://sano-network-report.986zhaozilong.workers.dev';
    const TEST_VERSION = '1.0.0';
    const REQUEST_TIMEOUT = 8000;
    const COOLDOWN_MS = 5 * 60 * 1000;
    const GLOBAL_COOLDOWN_KEY = 'sano_network_global_last_test';
    const LOCAL_PREVIEW = location.protocol === 'file:';

    const USER_TARGETS = {
      address1: 'https://api.sanolive.net/',
      address2: 'https://api.fofunlive.net/',
      github: location.origin + location.pathname,
      google: 'https://www.google.com/generate_204',
      googleConnectivity: 'https://connectivitycheck.gstatic.com/generate_204',
      cloudflareWeb: 'https://www.cloudflare.com/cdn-cgi/trace'
    };

    const DNS_DOMAINS = [
      'api.sanolive.net',
      'api.fofunlive.net'
    ];

    const STEP_ORDER = [
      'basic',
      'cloudflare',
      'dns',
      'address1',
      'address2',
      'speed'
    ];

    const userIdInput = document.getElementById('userId');
    const startBtn = document.getElementById('startBtn');
    const diagnostic = document.getElementById('diagnostic');
    const progressValue = document.getElementById('progressValue');
    const progressArea = document.getElementById('progressArea');
    const progressBar = document.getElementById('progressBar');
    const result = document.getElementById('result');
    const resultState = document.getElementById('resultState');
    const resultDesc = document.getElementById('resultDesc');
    const reportIdEl = document.getElementById('reportId');
    const submitStatus = document.getElementById('submitStatus');
    const cooldownText = document.getElementById('cooldownText');

    let running = false;
    let cooldownTimer = null;

    function validateUserId(value) {
      const userId = String(value || '').trim();
      const numeric = /^\d+$/.test(userId);
      const validLength = userId.length === 6 || userId.length === 8;

      return {
        userId,
        numeric,
        valid: numeric && validLength
      };
    }

    userIdInput.addEventListener('input', () => {
      const cleaned = userIdInput.value.replace(/\s+/g, '');
      if (cleaned !== userIdInput.value) {
        userIdInput.value = cleaned;
      }
      updateCooldownUI();
    });

    function createDiagnosticId() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');

      const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let random = '';

      if (window.crypto && crypto.getRandomValues) {
        const bytes = new Uint8Array(5);
        crypto.getRandomValues(bytes);

        for (const byte of bytes) {
          random += alphabet[byte % alphabet.length];
        }
      } else {
        for (let i = 0; i < 5; i++) {
          random += alphabet[Math.floor(Math.random() * alphabet.length)];
        }
      }

      return `SN-${y}${m}${d}-${random}`;
    }

    function getCooldownKey(userId) {
      return `sano_network_${userId}`;
    }

    function getGlobalCooldownRemaining() {
      const last = Number(
        localStorage.getItem(GLOBAL_COOLDOWN_KEY) || 0
      );

      if (!last) return 0;

      return Math.max(
        0,
        COOLDOWN_MS - (Date.now() - last)
      );
    }

    function getCooldownRemaining(userId) {
      const globalRemaining = getGlobalCooldownRemaining();

      let userRemaining = 0;

      if (userId) {
        const last = Number(
          localStorage.getItem(getCooldownKey(userId)) || 0
        );

        if (last) {
          userRemaining = Math.max(
            0,
            COOLDOWN_MS - (Date.now() - last)
          );
        }
      }

      return Math.max(globalRemaining, userRemaining);
    }

    function formatCountdown(ms) {
      const total = Math.ceil(ms / 1000);
      const min = Math.floor(total / 60);
      const sec = total % 60;
      return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function updateCooldownUI() {
      if (running) return;

      const validation = validateUserId(userIdInput.value);
      const remaining = getCooldownRemaining(
        validation.valid ? validation.userId : ''
      );

      if (remaining > 0) {
        startBtn.disabled = true;
        startBtn.textContent = `Try again in ${formatCountdown(remaining)}`;
        cooldownText.textContent =
          'Please wait before running another diagnostic.';
        return;
      }

      startBtn.disabled = false;
      startBtn.textContent = 'Start Network Test';
      cooldownText.textContent = '';
    }

    setInterval(updateCooldownUI, 1000);

    function resetSteps() {
      for (const key of STEP_ORDER) {
        setStep(key, 'pending', '');
      }
      setProgress(0);
    }

    function setStep(key, state, detail = '') {
      const el = document.querySelector(`[data-step="${key}"]`);
      if (!el) return;

      const icon = el.querySelector('.step-icon');
      const detailEl = el.querySelector('.step-detail');

      el.classList.toggle('running', state === 'running');

      icon.className = `step-icon ${state}`;

      const icons = {
        pending: '·',
        running: '⟳',
        success: '✓',
        warning: '!',
        error: '✕'
      };

      icon.textContent = icons[state] || '·';
      detailEl.textContent = detail || '';
    }

    function setProgress(percent) {
      const safe = Math.max(0, Math.min(100, Math.round(percent)));
      progressValue.textContent = `${safe}%`;
      progressBar.style.width = `${safe}%`;
    }

    function getBrowserNetwork() {
      const connection =
        navigator.connection ||
        navigator.mozConnection ||
        navigator.webkitConnection;

      return {
        online: navigator.onLine,
        type: connection?.type ?? null,
        effectiveType: connection?.effectiveType ?? null,
        rtt: connection?.rtt ?? null,
        downlink: connection?.downlink ?? null,
        saveData: connection?.saveData ?? null
      };
    }

    function getBrowserInfo() {
      return {
        userAgent: navigator.userAgent || null,
        language: navigator.language || null,
        platform: navigator.platform || null,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null
      };
    }

    function getPageTiming() {
      const nav = performance.getEntriesByType('navigation')[0];

      if (!nav) {
        return {
          dns: null,
          tcp: null,
          tls: null,
          ttfb: null,
          total: null
        };
      }

      const dns = nav.domainLookupEnd > 0
        ? Math.round(nav.domainLookupEnd - nav.domainLookupStart)
        : null;

      const tcp = nav.connectEnd > 0
        ? Math.round(nav.connectEnd - nav.connectStart)
        : null;

      const tls = nav.secureConnectionStart > 0 && nav.connectEnd > 0
        ? Math.round(nav.connectEnd - nav.secureConnectionStart)
        : null;

      const ttfb = nav.responseStart > 0
        ? Math.round(nav.responseStart - nav.requestStart)
        : null;

      const total = nav.responseEnd > 0
        ? Math.round(nav.responseEnd - nav.startTime)
        : null;

      return { dns, tcp, tls, ttfb, total };
    }

    async function fetchWithTimeout(url, options = {}, timeout = REQUEST_TIMEOUT) {
      if (typeof AbortController === 'undefined') {
        return fetch(url, options);
      }

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);

      try {
        return await fetch(url, {
          ...options,
          signal: controller.signal
        });
      } finally {
        clearTimeout(timer);
      }
    }

    async function testWorkerPing() {
      const start = performance.now();

      try {
        const response = await fetchWithTimeout(
          `${WORKER_URL}/ping?t=${Date.now()}`,
          { cache: 'no-store' }
        );

        const data = await response.json();

        return {
          success: response.ok && data.success === true,
          latency: Math.round(performance.now() - start),
          status: response.status,
          network: data.network || null
        };
      } catch (error) {
        return {
          success: false,
          latency: Math.round(performance.now() - start),
          status: null,
          error: error?.name || 'Error',
          message: error?.message || ''
        };
      }
    }

    async function getServerProbes() {
      try {
        const response = await fetchWithTimeout(
          `${WORKER_URL}/server-probes?t=${Date.now()}`,
          { cache: 'no-store' },
          10000
        );

        if (!response.ok) return null;
        return await response.json();
      } catch {
        return null;
      }
    }

    async function testOpaqueConnectivity(url, timeout = REQUEST_TIMEOUT) {
      const start = performance.now();

      try {
        await fetchWithTimeout(
          `${url}${url.includes('?') ? '&' : '?'}diag=${Date.now()}`,
          {
            mode: 'no-cors',
            cache: 'no-store',
            redirect: 'follow'
          },
          timeout
        );

        return {
          success: true,
          reachable: true,
          latency: Math.round(performance.now() - start),
          method: 'browser-no-cors'
        };
      } catch (error) {
        return {
          success: false,
          reachable: false,
          latency: Math.round(performance.now() - start),
          method: 'browser-no-cors',
          error: error?.name || 'Error',
          message: error?.message || ''
        };
      }
    }

    async function testSameOrigin(url, timeout = REQUEST_TIMEOUT) {
      const start = performance.now();

      try {
        const response = await fetchWithTimeout(
          `${url}${url.includes('?') ? '&' : '?'}diag=${Date.now()}`,
          {
            cache: 'no-store',
            redirect: 'follow'
          },
          timeout
        );

        return {
          success: response.ok,
          reachable: true,
          status: response.status,
          latency: Math.round(performance.now() - start)
        };
      } catch (error) {
        return {
          success: false,
          reachable: false,
          status: null,
          latency: Math.round(performance.now() - start),
          error: error?.name || 'Error',
          message: error?.message || ''
        };
      }
    }

    async function queryDns(resolver, domain, type) {
      const endpoint = resolver === 'cloudflare'
        ? `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(domain)}&type=${type}`
        : `https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=${type}`;

      const start = performance.now();

      try {
        const response = await fetchWithTimeout(
          endpoint,
          {
            cache: 'no-store',
            headers: {
              Accept: resolver === 'cloudflare'
                ? 'application/dns-json'
                : 'application/json'
            }
          }
        );

        const data = await response.json();
        const answers = Array.isArray(data.Answer)
          ? data.Answer.map(item => item.data).filter(Boolean)
          : [];

        return {
          success: response.ok && data.Status === 0,
          resolver,
          type,
          dnsStatus: data.Status ?? null,
          hasAnswer: answers.length > 0,
          answers,
          latency: Math.round(performance.now() - start)
        };
      } catch (error) {
        return {
          success: false,
          resolver,
          type,
          dnsStatus: null,
          hasAnswer: false,
          answers: [],
          latency: Math.round(performance.now() - start),
          error: error?.name || 'Error',
          message: error?.message || ''
        };
      }
    }

    async function testDns() {
      const tasks = [];

      for (const domain of DNS_DOMAINS) {
        for (const resolver of ['cloudflare', 'google']) {
          for (const type of ['A', 'AAAA']) {
            tasks.push({ domain, resolver, type });
          }
        }
      }

      const values = await Promise.all(
        tasks.map(task => queryDns(task.resolver, task.domain, task.type))
      );

      const result = {};

      tasks.forEach((task, index) => {
        if (!result[task.domain]) {
          result[task.domain] = {};
        }

        if (!result[task.domain][task.resolver]) {
          result[task.domain][task.resolver] = {};
        }
        result[task.domain][task.resolver][task.type] = values[index];
      });

      return result;
    }

    function analyzeDns(dns) {
      const warnings = [];
      const errors = [];
      const details = [];

      for (const domain of DNS_DOMAINS) {
        const cfA = dns?.[domain]?.cloudflare?.A;
        const googleA = dns?.[domain]?.google?.A;

        const cfOk = Boolean(cfA?.success && cfA?.hasAnswer);
        const googleOk = Boolean(googleA?.success && googleA?.hasAnswer);

        if (!cfOk && !googleOk) {
          errors.push(`${domain}: Cloudflare DNS 和 Google DNS 均无法正常解析`);
          details.push({
            domain,
            level: 'error',
            cloudflare: cfA || null,
            google: googleA || null
          });
          continue;
        }

        if (!cfOk || !googleOk) {
          const failedResolver = !cfOk ? 'Cloudflare DNS' : 'Google DNS';

          warnings.push(`${domain}: ${failedResolver} 无法正常解析`);
          details.push({
            domain,
            level: 'warning',
            failedResolver,
            cloudflare: cfA || null,
            google: googleA || null
          });
          continue;
        }

        const cfSet = new Set(cfA.answers || []);
        const googleSet = new Set(googleA.answers || []);
        const overlap = [...cfSet].some(ip => googleSet.has(ip));

        if (!overlap) {
          warnings.push(`${domain}: Cloudflare DNS 与 Google DNS 返回结果不一致`);
          details.push({
            domain,
            level: 'warning',
            reason: 'inconsistent',
            cloudflare: cfA,
            google: googleA
          });
        } else {
          details.push({
            domain,
            level: 'normal',
            cloudflare: cfA,
            google: googleA
          });
        }
      }

      const level =
        errors.length > 0
          ? 'error'
          : warnings.length > 0
            ? 'warning'
            : 'normal';

      return {
        success: level !== 'error',
        level,
        warnings,
        errors,
        problems: [...errors, ...warnings],
        details
      };
    }

    async function estimateDownloadSpeed() {
      const start = performance.now();
      const requests = [];
      const count = 4;

      for (let i = 0; i < count; i++) {
        const url = `${location.pathname}?speed=${Date.now()}_${i}`;

        requests.push(
          fetchWithTimeout(
            url,
            { cache: 'no-store' },
            10000
          ).then(async response => {
            const buffer = await response.arrayBuffer();
            return buffer.byteLength;
          })
        );
      }

      try {
        const sizes = await Promise.all(requests);
        const durationMs = Math.max(1, performance.now() - start);
        const bytes = sizes.reduce((sum, size) => sum + size, 0);
        const downloadMbps = Number(
          ((bytes * 8) / (durationMs / 1000) / 1000 / 1000).toFixed(2)
        );

        return {
          success: true,
          downloadMbps,
          durationMs: Math.round(durationMs),
          bytes,
          source: 'GitHub Pages repeated download'
        };
      } catch (error) {
        return {
          success: false,
          downloadMbps: null,
          durationMs: Math.round(performance.now() - start),
          bytes: 0,
          source: 'GitHub Pages repeated download',
          error: error?.name || 'Error',
          message: error?.message || ''
        };
      }
    }

    function speedLabel(speed) {
      if (!speed?.success || speed.downloadMbps == null) {
        return 'Unavailable';
      }

      if (speed.downloadMbps >= 10) return `${speed.downloadMbps} Mbps`;
      if (speed.downloadMbps >= 3) return `${speed.downloadMbps} Mbps`;
      if (speed.downloadMbps >= 1) return `${speed.downloadMbps} Mbps`;
      return `${speed.downloadMbps} Mbps`;
    }

    function buildSummary(data) {
      const criticalZh = [];
      const criticalEn = [];
      const partialZh = [];
      const partialEn = [];

      if (!data.basic.online) {
        criticalZh.push('设备当前处于离线状态');
        criticalEn.push('Your device appears to be offline');
      }

      // Cloudflare-only failure is a partial connectivity issue rather than
      // proof that the whole Internet connection is broken.
      if (!data.cloudflare.success && !LOCAL_PREVIEW) {
        partialZh.push('Cloudflare 网络诊断节点当前无法访问');
        partialEn.push('Cloudflare connectivity is currently unavailable');
      }

      if (data.dnsAnalysis.level === 'error') {
        criticalZh.push('公共 DNS 解析失败');
        criticalEn.push('Public DNS resolution failed');
      } else if (data.dnsAnalysis.level === 'warning') {
        partialZh.push('部分公共 DNS 解析服务不可用或结果不一致');
        partialEn.push('Public DNS is only partially available or resolver results differ');
      }

      if (!data.address1.success) {
        criticalZh.push('地址 1 无法连接');
        criticalEn.push('Address 1 is unreachable');
      }

      if (!data.address2.success) {
        criticalZh.push('地址 2 无法连接');
        criticalEn.push('Address 2 is unreachable');
      }

      if (!data.speed.success) {
        partialZh.push('网络测速失败');
        partialEn.push('Network speed test could not be completed');
      }

      const externalFailures = Object.entries(data.external || {})
        .filter(([, value]) => !value?.success)
        .map(([key]) => key);

      if (externalFailures.length > 0) {
        partialZh.push(`部分外部网络检测失败：${externalFailures.join(', ')}`);
        partialEn.push('Some external connectivity checks failed');
      }

      let level = 'normal';
      let mainProblem = '网络正常';
      let description = '未检测到明显的网络连接异常。';

      let uiTitle = 'Test Complete · Network Normal';
      let uiDescription = 'No obvious network connectivity issues were detected.';

      if (criticalZh.length > 0) {
        level = criticalZh.length >= 2 ? 'error' : 'warning';
        mainProblem = criticalZh[0];
        description = [...criticalZh, ...partialZh].join('；') + '。';

        uiTitle = 'Test Complete · Network Issue Detected';
        uiDescription = [...criticalEn, ...partialEn].join('; ') + '.';
      } else if (partialZh.length > 0) {
        level = 'warning';
        mainProblem = partialZh[0];
        description = partialZh.join('；') + '。';

        uiTitle = 'Test Complete · Partial Connectivity Issue';
        uiDescription = partialEn.join('; ') + '.';
      }

      return {
        level,
        mainProblem,
        description,
        userFacingProblems: criticalZh,
        partialProblems: partialZh,
        externalFailures,
        uiTitle,
        uiDescription
      };
    }

    async function submitReportOnce(report) {
      const response = await fetchWithTimeout(
        `${WORKER_URL}/report`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(report)
        },
        45000
      );

      let result = {};

      try {
        result = await response.json();
      } catch {}

      if (!response.ok || result.success !== true) {
        throw new Error(
          result.message ||
          result.githubMessage ||
          `HTTP ${response.status}`
        );
      }

      return result;
    }

    async function submitReport(report) {
      let firstError;

      try {
        return await submitReportOnce(report);
      } catch (error) {
        firstError = error;
      }

      await new Promise(resolve => setTimeout(resolve, 1200));

      try {
        return await submitReportOnce(report);
      } catch (secondError) {
        const firstMessage = firstError?.message || 'Unknown error';
        const secondMessage = secondError?.message || 'Unknown error';

        if (firstMessage !== secondMessage) {
          throw new Error(`${secondMessage} (first attempt: ${firstMessage})`);
        }

        throw secondError;
      }
    }

    function showFinalResult(summary, diagnosticId) {
      result.classList.add('show');
      reportIdEl.textContent = diagnosticId;

      resultState.className = 'result-state';

      if (summary.level === 'normal') {
        resultState.classList.add('normal');
        resultState.innerHTML =
          `<span>✓</span><span>${summary.uiTitle || 'Test Complete · Network Normal'}</span>`;
      } else if (summary.level === 'warning') {
        resultState.classList.add('warning');
        resultState.innerHTML =
          `<span>⚠</span><span>${summary.uiTitle || 'Test Complete · Network Issue Detected'}</span>`;
      } else {
        resultState.classList.add('error');
        resultState.innerHTML =
          `<span>⚠</span><span>${summary.uiTitle || 'Test Complete · Network Issue Detected'}</span>`;
      }

      resultDesc.textContent =
        summary.uiDescription ||
        'The diagnostic test has completed.';
    }

    async function runDiagnostic() {
      if (running) return;

      const validation = validateUserId(userIdInput.value);
      const remaining = getCooldownRemaining(
        validation.valid ? validation.userId : ''
      );

      if (remaining > 0) {
        updateCooldownUI();
        return;
      }

      running = true;
      startBtn.disabled = true;
      startBtn.textContent = 'Testing...';
      userIdInput.disabled = true;
      diagnostic.classList.add('show');
      progressArea.style.display = '';
      result.classList.remove('show');
      submitStatus.className = 'submit-status';
      submitStatus.textContent = '';
      cooldownText.textContent = '';

      resetSteps();

      const diagnosticId = createDiagnosticId();
      const reportTime = new Date().toISOString();

      const reportData = {
        basic: null,
        cloudflare: null,
        dns: null,
        dnsAnalysis: null,
        address1: null,
        address2: null,
        speed: null,
        external: {},
        serverProbes: null
      };

      try {
        // 1. 基础网络
        setStep('basic', 'running', 'Testing');
        setProgress(8);

        const browserNetwork = getBrowserNetwork();

        reportData.basic = {
          online: navigator.onLine,
          browserNetwork
        };

        await new Promise(resolve => setTimeout(resolve, 180));

        setStep(
          'basic',
          navigator.onLine ? 'success' : 'error',
          navigator.onLine
            ? (browserNetwork.effectiveType || 'Online')
            : 'Offline'
        );

        setProgress(17);

        // 2. Cloudflare
        setStep('cloudflare', 'running', 'Testing');

        const [workerPing, serverProbes] = await Promise.all([
          testWorkerPing(),
          getServerProbes()
        ]);

        reportData.cloudflare = workerPing;
        reportData.serverProbes = serverProbes;

        setStep(
          'cloudflare',
          workerPing.success ? 'success' : (LOCAL_PREVIEW ? 'warning' : 'error'),
          workerPing.success
            ? `${workerPing.latency} ms`
            : (LOCAL_PREVIEW ? 'Local preview limited' : 'Connection failed')
        );

        setProgress(32);

        // 3. DNS
        setStep('dns', 'running', 'Testing');

        const dns = await testDns();
        const dnsAnalysis = analyzeDns(dns);

        reportData.dns = dns;
        reportData.dnsAnalysis = dnsAnalysis;

        const dnsStepState =
          dnsAnalysis.level === 'error'
            ? 'error'
            : dnsAnalysis.level === 'warning'
              ? 'warning'
              : 'success';

        const dnsStepDetail =
          dnsAnalysis.level === 'error'
            ? 'DNS failed'
            : dnsAnalysis.level === 'warning'
              ? 'Partial DNS'
              : 'Resolved';

        setStep(
          'dns',
          dnsStepState,
          dnsStepDetail
        );

        setProgress(48);

        // 4 + 5 + 后台外部连通性并行
        setStep('address1', 'running', 'Testing');
        setStep('address2', 'running', 'Testing');

        const [
          address1,
          address2,
          github,
          google,
          googleConnectivity,
          cloudflareWeb
        ] = await Promise.all([
          testOpaqueConnectivity(USER_TARGETS.address1),
          testOpaqueConnectivity(USER_TARGETS.address2),
          testSameOrigin(USER_TARGETS.github),
          testOpaqueConnectivity(USER_TARGETS.google),
          testOpaqueConnectivity(USER_TARGETS.googleConnectivity),
          testOpaqueConnectivity(USER_TARGETS.cloudflareWeb)
        ]);

        reportData.address1 = address1;
        reportData.address2 = address2;

        reportData.external = {
          github,
          google,
          googleConnectivity,
          cloudflareWeb
        };

        setStep(
          'address1',
          address1.success ? 'success' : 'error',
          address1.success
            ? `${address1.latency} ms`
            : 'Connection failed'
        );

        setProgress(62);

        setStep(
          'address2',
          address2.success ? 'success' : 'error',
          address2.success
            ? `${address2.latency} ms`
            : 'Connection failed'
        );

        setProgress(74);

        // 6. 测速
        setStep('speed', 'running', 'Testing');

        const speed = await estimateDownloadSpeed();
        reportData.speed = speed;

        setStep(
          'speed',
          speed.success ? 'success' : 'warning',
          speedLabel(speed)
        );

        setProgress(92);

        // 结论
        const summary = buildSummary(reportData);
        showFinalResult(summary, diagnosticId);

        const payload = {
          version: TEST_VERSION,
          userId: validation.userId,
          diagnosticId,
          time: reportTime,

          browser: getBrowserInfo(),

          browserNetwork:
            reportData.basic.browserNetwork,

          pageTiming:
            getPageTiming(),

          tests: {
            basic:
              reportData.basic,

            cloudflare:
              reportData.cloudflare,

            dns:
              reportData.dns,

            dnsAnalysis:
              reportData.dnsAnalysis,

            sano:
              reportData.address1,

            fofun:
              reportData.address2,

            external:
              reportData.external,

            serverProbeSnapshot:
              reportData.serverProbes
                ? {
                    version:
                      reportData.serverProbes.version || null,

                    http:
                      reportData.serverProbes.http || null
                  }
                : null
          },

          speed:
            reportData.speed,

          summary
        };

        // 只有 6 位 / 8 位纯数字 ID 才上传
        if (validation.valid) {
          if (LOCAL_PREVIEW) {
            submitStatus.className = 'submit-status warn';
            submitStatus.textContent =
              '⚠ Local preview mode. Reports will be submitted automatically after deployment to GitHub Pages.';
          } else {
            submitStatus.className = 'submit-status';
            submitStatus.textContent = '⟳ Submitting report automatically...';

            try {
              const submitResult = await submitReport(payload);

              const cooldownStartedAt = String(Date.now());

              localStorage.setItem(
                getCooldownKey(validation.userId),
                cooldownStartedAt
              );

              localStorage.setItem(
                GLOBAL_COOLDOWN_KEY,
                cooldownStartedAt
              );

              submitStatus.className = 'submit-status ok';
              submitStatus.textContent =
                `✓ Report submitted automatically${submitResult.issueNumber ? ` · #${submitResult.issueNumber}` : ''}`;
            } catch (error) {
              submitStatus.className = 'submit-status error';
              submitStatus.textContent =
                `✕ Report submission failed: ${error?.message || 'Unknown error'}`;
            }
          }
        } else {
          // Invalid IDs are checked silently.
          // Complete the diagnostic, skip upload, show no ID warning.
          submitStatus.className = 'submit-status';
          submitStatus.textContent = '';
        }

        setProgress(100);
        setTimeout(() => {
          progressArea.style.display = 'none';
        }, 320);

      } catch (error) {
        console.error(error);

        const summary = {
          level: 'error',
          mainProblem: '检测过程异常中断',
          description: '检测过程中出现异常，请稍后重试。',
          uiTitle: 'Test Complete · Diagnostic Interrupted',
          uiDescription: 'An unexpected error occurred during the diagnostic test. Please try again later.'
        };

        showFinalResult(summary, diagnosticId);
        submitStatus.className = 'submit-status error';
        submitStatus.textContent = `✕ ${error?.message || 'Diagnostic error'}`;
        setProgress(100);
        setTimeout(() => {
          progressArea.style.display = 'none';
        }, 320);
      } finally {
        running = false;
        userIdInput.disabled = false;

        if (validation.valid && getGlobalCooldownRemaining() <= 0) {
          const cooldownStartedAt = String(Date.now());

          localStorage.setItem(
            getCooldownKey(validation.userId),
            cooldownStartedAt
          );

          localStorage.setItem(
            GLOBAL_COOLDOWN_KEY,
            cooldownStartedAt
          );
        }

        updateCooldownUI();

        if (!startBtn.disabled) {
          startBtn.textContent = 'Test Again';
        }
      }
    }

    startBtn.addEventListener('click', runDiagnostic);

    userIdInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !startBtn.disabled) {
        runDiagnostic();
      }
    });

    updateCooldownUI();
  </script>
